<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessera</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%23e0913f'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%234f9d98'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%23777'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%23e0913f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="login" class="login" hidden>
    <div class="brand"><span class="logo"><i></i><i></i><i></i><i></i></span>Tessera</div>
    <input id="password" type="password" placeholder="Пароль" aria-label="Пароль" autocomplete="current-password" autofocus>
    <button class="primary">Войти</button>
    <p id="login-error" class="error"></p>
  </form>

  <div id="shell" class="shell" hidden>
    <nav class="sidebar">
      <a class="brand" href="#/"><span class="logo"><i></i><i></i><i></i><i></i></span>Tessera</a>
      <a id="nav-overview" class="nav-row" href="#/"></a>
      <div class="nav-label"><span>Приложения</span><button id="add" class="icon-button" title="Добавить приложение" aria-label="Добавить приложение"></button></div>
      <div id="nav-apps" class="nav-apps"></div>
      <button id="logout" class="nav-row nav-bottom"></button>
    </nav>
    <main id="page" class="page"></main>
  </div>

  <dialog id="create"></dialog>
  <dialog id="confirm" class="confirm"></dialog>
  <div id="toasts" class="toasts" role="status"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
